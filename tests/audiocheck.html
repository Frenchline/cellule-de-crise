<!DOCTYPE html>
<!-- Harnais audio headless.
     Smoke (défaut) : nappes d'ambiance, tension, radio, stingers, tic-tac
       sans exception.
       google-chrome --headless=new --autoplay-policy=no-user-gesture-required
         --virtual-time-budget=6000 --dump-dom tests/audiocheck.html
     ?levels : mesure RÉELLE des niveaux via AnalyserNode sur le bus maître
       (pics/RMS en dBFS : nappe @ menace 1/4/7, burst radio, threatUp,
       tic-tac). L'horloge AudioContext tourne en temps réel : une image
       lente (tools/audiowait.py sur :8099) retarde le load ~16 s.
       python3 tools/audiowait.py &   # serveur de délai, port 8099
       google-chrome --headless=new --autoplay-policy=no-user-gesture-required
         --dump-dom "tests/audiocheck.html?levels"
     Le localStorage est pré-rempli SANS la clé « music » pour simuler
     un joueur de retour (migration des réglages). -->
<html><head><meta charset="utf-8"></head><body>
<script>
localStorage.setItem('negociateur_settings_v1',
  JSON.stringify({ mute: false, volume: 0.7, rain: true, flash: true }));
if (location.search.includes('levels'))
  document.write('<img src="http://127.0.0.1:8099/wait.png?s=22" style="display:none" alt="">');
</script>
<script type="module">
import * as AU from '../js/audio.js';
const lines = [];
let ok = true;
const pre = document.createElement('pre');
pre.id = 'audiocheck';
document.body.append(pre);
const out = o => { pre.textContent = JSON.stringify(o); };
const step = (name, fn) => { try { fn(); lines.push(`${name}:ok`); } catch (e) { ok = false; lines.push(`${name}:ERR ${e.message}`); } };
const sleep = ms => new Promise(r => setTimeout(r, ms));

step('initAudio', () => AU.initAudio());
const an = AU.attachAnalyser();

async function measure(ms = 1400) {
  const buf = new Float32Array(an.fftSize);
  let peak = 0, rmsM = 0;
  const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    an.getFloatTimeDomainData(buf);
    let p = 0, s = 0;
    for (const v of buf) { const a = Math.abs(v); if (a > p) p = a; s += v * v; }
    if (p > peak) peak = p;
    const r = Math.sqrt(s / buf.length); if (r > rmsM) rmsM = r;
    await sleep(35);
  }
  const db = v => v > 0 ? +(20 * Math.log10(v)).toFixed(1) : null;
  return { peak: db(peak), rms: db(rmsM) };
}

(async () => {
  const report = { ok, lines, ctx: AU.audioCtxState(), settings: AU.audioSettings() };
  for (const m of ['menu', 'cinematique', 'game', null]) step(`setAmbience:${m}`, () => AU.setAmbience(m));
  step('setTension', () => AU.setTension({ threat: 7, deckLeft: 0, fog: true, chronoLeft: 8 }));
  step('stingers', () => { AU.playThreatUp(); AU.playThreatDown(); AU.playDeathTone(); });
  step('radio', () => AU.playRadioChatter());
  step('swell', () => AU.swell());
  step('sfx', () => { AU.playDice(); AU.playTerrorStinger(); AU.playGunshot(); AU.playChime(); AU.playSquelch(); });
  out(report);
  if (!location.search.includes('levels')) return;
  const lv = {};
  // nappe de tension seule : tic-tac coupé (cut), deck au-dessus de 4
  AU.setAmbience('game');
  AU.setTension({ cut: true, over: false, fog: false, deckLeft: 9 });
  for (const th of [1, 4, 7]) {
    AU.setTension({ threat: th });
    await sleep(2200);            // transitions ~1,5 s
    lv[`bed_${th}`] = await measure(1400);
  }
  // burst radio seul : nappe au minimum (menace 1)
  AU.setTension({ threat: 1 });
  await sleep(2200);
  AU.playRadioChatter();
  lv.radio = await measure(2600);
  // stinger menace+
  AU.playThreatUp();
  lv.threatUp = await measure(900);
  // tic-tac : pioche ≤ 2 → 2 tics/s (ambiance coupée pour isoler)
  AU.setAmbienceEnabled(false);
  AU.setTension({ cut: false, deckLeft: 1 });
  await sleep(400);
  lv.tick = await measure(1300);
  report.levels = lv;
  out(report);
})();
</script>
</body></html>
